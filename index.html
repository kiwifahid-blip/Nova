<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova 8-Bit Multiplayer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="auth-screen" class="auth-overlay">
    <div class="auth-box">
      <h1 class="logo-title">NOVA</h1>
      <h2 id="auth-title">Sign Up</h2>

      <form id="auth-form">
        <input type="email" id="auth-email" placeholder="Email" required />
        <input type="password" id="auth-password" placeholder="Password (min 6 chars)" required />
        <input type="text" id="auth-username" placeholder="Username (e.g. Sparkin)" required />

        <button type="button" id="auth-btn" class="main-auth-btn">Sign Up</button>
      </form>

      <p class="auth-toggle">
        Already have an account? <span id="toggle-auth-mode">Log In</span>
      </p>
      <p id="auth-error" class="error-msg"></p>
    </div>
  </div>

  <div class="top-bar">
    <div class="profile-section">
      <div class="profile-avatar"></div>
      <h1>Welcome, <span id="username">Loading...</span></h1>
    </div>

    <div class="friends-box" id="friends-box"></div>

    <div class="friend-search-container">
      <div class="friend-search-bar">
        <input type="text" id="search-person-input" placeholder="Search people..." />
        <button type="button" id="search-person-btn">Search</button>
      </div>
      <div id="search-results-dropdown" class="search-results-dropdown hidden"></div>
    </div>
  </div>

  <div id="dashboard-view" class="played-section">
    <h2>Played</h2>

    <div class="game-card" id="open-game-btn">
      <div class="game-thumbnail">
        <div class="retro-sprite"></div>
      </div>
      <div class="game-info">
        <div class="game-name">test</div>
        <div class="people-count">People: <span id="dashboard-people-count">0</span></div>
      </div>
    </div>
  </div>

  <div id="game-page-view" class="game-page hidden">
    <button id="back-btn" class="back-btn">← Back to Home</button>

    <div id="game-details-container" class="game-page-container">
      <div class="game-preview">
        <div class="retro-sprite large"></div>
      </div>

      <div class="game-details-info">
        <h1 class="page-title">test</h1>
        <p class="creator-info">By <span class="creator-name" id="game-creator">@loading</span></p>

        <div class="stats-container">
          <div class="stat-box">
            <span class="stat-title">Visits</span>
            <span class="stat-value" id="visit-count">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-title">Playing</span>
            <span class="stat-value" id="playing-count">0</span>
          </div>
        </div>

        <button id="start-play-btn" class="play-btn">▶ PLAY</button>
      </div>
    </div>

    <div id="game-canvas-container" class="fullscreen-game-overlay hidden">
      <canvas id="game-canvas"></canvas>

      <div id="game-chat-box" class="game-chat-container">
        <div id="chat-messages" class="chat-messages-list"></div>
        <form id="chat-form" class="chat-form-input">
          <input type="text" id="chat-input" placeholder="Press ENTER to chat..." maxlength="50" autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </div>

      <div id="pause-menu" class="pause-menu-overlay hidden">
        <div class="pause-box">
          <h2>GAME PAUSED</h2>

          <div class="controls-guide">
            <h3>CONTROLS</h3>
            <p><strong>A / D</strong> or <strong>← / →</strong> : Move Left / Right</p>
            <p><strong>W</strong> or <strong>Space</strong> or <strong>↑</strong> : Jump</p>
            <p><strong>Enter</strong> : Open / Send Chat</p>
            <p><strong>ESC</strong> : Toggle Pause Menu</p>
          </div>

          <button id="resume-btn" class="menu-btn">Resume Game</button>
          <button id="exit-game-btn" class="menu-btn exit-btn">Exit Game</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

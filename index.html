<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Nova Game Hub</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="auth-screen" class="auth-overlay">
    <div class="auth-card">
      <h2 id="auth-title">Sign Up</h2>
      <p id="auth-error" class="error-text"></p>
      
      <form id="auth-form" onsubmit="return false;">
        <input type="text" id="auth-username" placeholder="Username" required />
        
        <select id="auth-gender" class="auth-select">
          <option value="boy">Male 👦</option>
          <option value="girl">Female 👧</option>
        </select>

        <input type="email" id="auth-email" placeholder="Email" required />
        <input type="password" id="auth-password" placeholder="Password (min 6 chars)" required />
        
        <button id="auth-btn" class="primary-btn">Sign Up</button>
      </form>

      <p class="toggle-text">
        <span id="toggle-auth-mode">Log In</span>
      </p>
    </div>
  </div>


  <div id="dashboard-view" class="app-container">
    
    <header class="top-header">
      <div class="user-info">
        <span>Welcome, <strong id="username">Player</strong> (#<span id="player-id-display">--</span>)</span>
      </div>
      <button id="logout-btn" class="logout-button">Log Out</button>
    </header>

    <main class="dashboard-content">
      
      <section class="games-section">
        <h2>Featured Games</h2>
        
        <div class="game-cards-grid">
          <div class="game-card" id="open-game-btn">
            <div class="game-thumbnail">
              <span class="game-icon">🎮</span>
            </div>
            <div class="game-info">
              <h3>Nova World</h3>
              <p>Created by <span id="game-creator">@898</span></p>
              <div class="game-stats">
                <span>👁️ Visits: <strong id="visit-count">0</strong></span>
                <span>👥 Playing: <strong id="dashboard-people-count">0</strong></span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <aside class="friends-sidebar">
        <h3>Friends & Players</h3>
        
        <div class="friend-search-box">
          <input type="text" id="friend-search-input" placeholder="Search by name or #ID..." />
          <button id="friend-search-btn">Search</button>
        </div>

        <div id="friends-box" class="friends-list">
          <span style="color: #666; font-style: italic;">No friends added yet</span>
        </div>
      </aside>

    </main>
  </div>


  <div id="game-page-view" class="app-container hidden">
    
    <button id="back-btn" class="back-button">← Back to Dashboard</button>

    <div id="game-details-container" class="game-banner">
      <h1>Nova World</h1>
      <p>Explore, hang out, and chat with friends online!</p>
      <div class="game-meta">
        <span>Playing: <strong id="playing-count">0</strong></span>
      </div>
      <button id="start-play-btn" class="play-btn">PLAY</button>
    </div>

    <div id="game-canvas-container" class="game-viewport hidden">
      <canvas id="game-canvas"></canvas>

      <div class="chat-overlay">
        <form id="chat-form">
          <input type="text" id="chat-input" placeholder="Press Enter to chat..." autocomplete="off" />
        </form>
      </div>

      <div id="pause-menu" class="pause-overlay hidden">
        <div class="pause-card">
          <h2>Game Paused</h2>
          <button id="resume-btn" class="menu-btn">Resume Game</button>
          <button id="exit-game-btn" class="menu-btn danger">Exit Game</button>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>

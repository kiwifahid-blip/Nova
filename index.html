<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova 8-Bit Multiplayer</title>
  <style>
    /* GLOBAL LAYOUT */
    body {
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 30px;
      margin: 0;
    }

    .hidden {
      display: none !important;
    }

    /* AUTHENTICATION OVERLAY */
    .auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(10, 10, 10, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .auth-box {
      background-color: #000;
      border: 3px solid #00ffcc;
      padding: 40px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
    }

    .logo-title {
      font-size: 40px;
      color: #00ffcc;
      margin: 0;
      letter-spacing: 4px;
    }

    .auth-box input {
      background-color: #111;
      border: 2px solid #fff;
      color: #fff;
      padding: 10px;
      font-size: 16px;
      outline: none;
      width: 90%;
      margin-bottom: 10px;
    }

    .auth-box input:focus {
      border-color: #00ffcc;
    }

    .main-auth-btn {
      background-color: #00ffcc;
      color: #000;
      border: none;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    .main-auth-btn:hover {
      background-color: #00cc88;
    }

    .auth-toggle {
      font-size: 14px;
      color: #aaa;
    }

    #toggle-auth-mode {
      color: #00ffcc;
      cursor: pointer;
      text-decoration: underline;
    }

    .error-msg {
      color: #ff0055;
      font-size: 14px;
      margin: 0;
    }

    /* TOP HEADER & FRIENDS BAR */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 30px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .profile-section {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .profile-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid #fff;
      background-color: #333;
    }

    .profile-section h1 {
      font-size: 28px;
      margin: 0;
      font-weight: normal;
    }

    .friends-box {
      border: 3px solid #fff;
      border-radius: 20px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 400px;
      max-width: 600px;
      min-height: 40px;
      overflow-x: auto;
    }

    .friend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #222;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid #444;
      white-space: nowrap;
    }

    .friend-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #00ffcc;
      background-color: #555;
    }

    /* SEARCH FRIENDS SECTION */
    .friend-search-container {
      display: flex;
      flex-direction: column;
      gap: 5px;
      position: relative;
    }

    .friend-search-bar {
      display: flex;
      gap: 8px;
    }

    .friend-search-bar input {
      background-color: #000;
      border: 2px solid #00ffcc;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    .friend-search-bar button {
      background-color: #00ffcc;
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .friend-search-bar button:hover {
      background-color: #00cc88;
    }

    .search-results-dropdown {
      position: absolute;
      top: 45px;
      left: 0;
      width: 100%;
      background-color: #000;
      border: 2px solid #00ffcc;
      border-radius: 8px;
      z-index: 100;
      max-height: 150px;
      overflow-y: auto;
    }

    .search-result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid #222;
    }

    .search-result-item button {
      background-color: #00e676;
      color: #000;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    /* PLAYED SECTION */
    .played-section h2 {
      font-size: 32px;
      margin-bottom: 15px;
      font-weight: normal;
    }

    .game-card {
      width: 220px;
      border: 3px solid #fff;
      background-color: #000;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .game-card:hover {
      transform: scale(1.03);
      border-color: #00ffcc;
    }

    .game-thumbnail {
      width: 100%;
      height: 150px;
      border: 2px solid #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #222;
    }

    .retro-sprite {
      width: 40px;
      height: 60px;
      background-color: #00ffcc;
      border: 2px solid #fff;
    }

    .retro-sprite.large {
      width: 80px;
      height: 120px;
    }

    .game-info {
      margin-top: 10px;
    }

    .game-name {
      font-size: 22px;
      font-weight: bold;
    }

    .people-count {
      font-size: 18px;
      color: #ccc;
      margin-top: 5px;
    }

    /* GAME DETAILS & CANVAS */
    .back-btn {
      background: none;
      border: 2px solid #fff;
      color: #fff;
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .back-btn:hover {
      background-color: #333;
    }

    .game-page-container {
      display: flex;
      gap: 40px;
      border: 3px solid #fff;
      padding: 30px;
      background-color: #000;
    }

    .game-preview {
      width: 300px;
      height: 220px;
      border: 2px solid #fff;
      background-color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-details-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .page-title {
      font-size: 36px;
      margin: 0;
    }

    .creator-info {
      font-size: 18px;
      color: #aaa;
      margin: 10px 0 20px 0;
    }

    .creator-name {
      color: #00ffcc;
      font-weight: bold;
    }

    .stats-container {
      display: flex;
      gap: 30px;
      margin-bottom: 25px;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
    }

    .stat-title {
      font-size: 14px;
      color: #888;
    }

    .stat-value {
      font-size: 22px;
      font-weight: bold;
    }

    .play-btn {
      background-color: #00e676;
      color: #000;
      border: none;
      padding: 15px 40px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      width: fit-content;
      border-radius: 5px;
    }

    .play-btn:hover {
      background-color: #00c853;
    }

    /* FULLSCREEN OVERLAY */
    .fullscreen-game-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      overflow: hidden;
    }

    #game-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background-color: #70c5ce;
      image-rendering: pixelated;
    }

    .pause-menu-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2100;
    }

    .pause-box {
      background-color: #111;
      border: 3px solid #00ffcc;
      padding: 35px 50px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
      width: 320px;
    }

    .pause-box h2 {
      margin: 0;
      color: #00ffcc;
      font-size: 32px;
      letter-spacing: 2px;
    }

    .controls-guide {
      background-color: #000;
      border: 1px solid #333;
      padding: 15px;
      text-align: left;
      font-size: 14px;
    }

    .controls-guide h3 {
      margin: 0 0 10px 0;
      color: #00ffcc;
      font-size: 16px;
      text-align: center;
    }

    .controls-guide p {
      margin: 6px 0;
      color: #ccc;
    }

    .controls-guide strong {
      color: #fff;
    }

    .menu-btn {
      background-color: #00ffcc;
      color: #000;
      border: none;
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .menu-btn:hover {
      background-color: #00cc88;
    }

    .menu-btn.exit-btn {
      background-color: #ff0055;
      color: #fff;
    }

    .menu-btn.exit-btn:hover {
      background-color: #cc0044;
    }

    /* CHAT UI */
    .game-chat-container {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 300px;
      height: 220px;
      background-color: transparent;
      display: flex;
      flex-direction: column;
      padding: 0;
      z-index: 2050;
      pointer-events: auto;
    }

    .chat-messages-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      font-family: monospace;
      margin-bottom: 10px;
      word-break: break-word;
      padding-right: 5px;
    }

    .chat-message-item {
      background-color: rgba(0, 0, 0, 0.45);
      padding: 4px 8px;
      border-radius: 4px;
      line-height: 1.3;
      text-shadow: 1px 1px 2px #000;
    }

    .chat-author {
      color: #00ffcc;
      font-weight: bold;
    }

    .chat-form-input {
      display: flex;
      gap: 6px;
    }

    .chat-form-input input {
      flex: 1;
      background-color: rgba(0, 0, 0, 0.6);
      border: 2px solid #00ffcc;
      color: #fff;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      border-radius: 4px;
    }

    .chat-form-input input:focus {
      background-color: rgba(0, 0, 0, 0.9);
    }

    .chat-form-input button {
      background-color: #00ffcc;
      color: #000;
      border: none;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }

    .chat-form-input button:hover {
      background-color: #00cc88;
    }
  </style>
</head>
<body>

  <div id="auth-screen" class="auth-overlay">
    <div class="auth-box">
      <h1 class="logo-title">NOVA</h1>
      <h2 id="auth-title">Sign Up</h2>

      <form id="auth-form">
        <input type="email" id="auth-email" placeholder="Email" required />
        <input type="password" id="auth-password" placeholder="Password (min 6 chars)" required />
        <input type="text" id="auth-username" placeholder="Username (e.g. Sparkin)" required />

        <button type="button" id="auth-btn" class="main-auth-btn">Sign Up</button>
      </form>

      <p class="auth-toggle">
        Already have an account? <span id="toggle-auth-mode">Log In</span>
      </p>
      <p id="auth-error" class="error-msg"></p>
    </div>
  </div>

  <div class="top-bar">
    <div class="profile-section">
      <div class="profile-avatar"></div>
      <h1>Welcome, <span id="username">Loading...</span></h1>
    </div>

    <div class="friends-box" id="friends-box"></div>

    <div class="friend-search-container">
      <div class="friend-search-bar">
        <input type="text" id="search-person-input" placeholder="Search people..." />
        <button id="search-person-btn">Search</button>
      </div>
      <div id="search-results-dropdown" class="search-results-dropdown hidden"></div>
    </div>
  </div>

  <div id="dashboard-view" class="played-section">
    <h2>Played</h2>
    
    <div class="game-card" id="open-game-btn">
      <div class="game-thumbnail">
        <div class="retro-sprite"></div>
      </div>
      <div class="game-info">
        <div class="game-name">test</div>
        <div class="people-count">People: <span id="dashboard-people-count">0</span></div>
      </div>
    </div>
  </div>

  <div id="game-page-view" class="game-page hidden">
    <button id="back-btn" class="back-btn">← Back to Home</button>
    
    <div id="game-details-container" class="game-page-container">
      <div class="game-preview">
        <div class="retro-sprite large"></div>
      </div>

      <div class="game-details-info">
        <h1 class="page-title">test</h1>
        <p class="creator-info">By <span class="creator-name" id="game-creator">@loading</span></p>

        <div class="stats-container">
          <div class="stat-box">
            <span class="stat-title">Visits</span>
            <span class="stat-value" id="visit-count">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-title">Playing</span>
            <span class="stat-value" id="playing-count">0</span>
          </div>
        </div>

        <button id="start-play-btn" class="play-btn">▶ PLAY</button>
      </div>
    </div>

    <div id="game-canvas-container" class="fullscreen-game-overlay hidden">
      <canvas id="game-canvas"></canvas>
      
      <div id="game-chat-box" class="game-chat-container">
        <div id="chat-messages" class="chat-messages-list"></div>
        <form id="chat-form" class="chat-form-input">
          <input type="text" id="chat-input" placeholder="Press ENTER to chat..." maxlength="50" autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </div>

      <div id="pause-menu" class="pause-menu-overlay hidden">
        <div class="pause-box">
          <h2>GAME PAUSED</h2>
          
          <div class="controls-guide">
            <h3>CONTROLS</h3>
            <p><strong>A / D</strong> or <strong>← / →</strong> : Move Left / Right</p>
            <p><strong>W</strong> or <strong>Space</strong> or <strong>↑</strong> : Jump</p>
            <p><strong>Enter</strong> : Open / Send Chat</p>
            <p><strong>ESC</strong> : Toggle Pause Menu</p>
          </div>

          <button id="resume-btn" class="menu-btn">Resume Game</button>
          <button id="exit-game-btn" class="menu-btn exit-btn">Exit Game</button>
        </div>
      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { 
      getAuth, 
      setPersistence,
      browserLocalPersistence,
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      updateProfile,
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    import { 
      getDatabase, 
      ref, 
      onValue, 
      runTransaction, 
      set, 
      get,
      remove, 
      onDisconnect,
      push 
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAqM7xsEN6SHt-lrnlF2tHoRLHRbxdWlkI",
      authDomain: "nova-ca4b5.firebaseapp.com",
      projectId: "nova-ca4b5",
      storageBucket: "nova-ca4b5.firebasestorage.app",
      messagingSenderId: "491973304543",
      appId: "1:491973304543:web:f63d6ff665b9c8551c896a",
      measurementId: "G-90TDNQ5VXP",
      databaseURL: "https://nova-ca4b5-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Keep logged-in session saved
    setPersistence(auth, browserLocalPersistence).catch(console.error);

    // DOM ELEMENTS
    const authScreen = document.getElementById("auth-screen");
    const authTitle = document.getElementById("auth-title");
    const authBtn = document.getElementById("auth-btn");
    const toggleAuthMode = document.getElementById("toggle-auth-mode");
    const usernameInput = document.getElementById("auth-username");
    const emailInput = document.getElementById("auth-email");
    const passwordInput = document.getElementById("auth-password");
    const errorMsg = document.getElementById("auth-error");

    const usernameDisplay = document.getElementById("username");
    const gameCreatorDisplay = document.getElementById("game-creator");
    const friendsBox = document.getElementById("friends-box");

    const searchPersonInput = document.getElementById("search-person-input");
    const searchPersonBtn = document.getElementById("search-person-btn");
    const searchResultsDropdown = document.getElementById("search-results-dropdown");

    let isSignUp = true; 
    let currentUser = null;

    toggleAuthMode.addEventListener("click", () => {
      isSignUp = !isSignUp;
      if (isSignUp) {
        authTitle.textContent = "Sign Up";
        authBtn.textContent = "Sign Up";
        usernameInput.style.display = "block";
        toggleAuthMode.textContent = "Log In";
      } else {
        authTitle.textContent = "Log In";
        authBtn.textContent = "Log In";
        usernameInput.style.display = "none";
        toggleAuthMode.textContent = "Sign Up";
      }
      errorMsg.textContent = "";
    });

    authBtn.addEventListener("click", async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      const username = usernameInput.value.trim();

      errorMsg.textContent = "";

      if (!email || !password) {
        errorMsg.textContent = "Please fill in email and password!";
        return;
      }

      try {
        if (isSignUp) {
          if (!username) {
            errorMsg.textContent = "Please enter a username!";
            return;
          }
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          await updateProfile(userCredential.user, { displayName: username });
          
          // Register public user record for search
          await set(ref(db, `users/${userCredential.user.uid}`), {
            username: username
          });

          usernameDisplay.textContent = username;
          gameCreatorDisplay.textContent = `@${username}`;
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (error) {
        errorMsg.textContent = error.message.replace("Firebase: ", "");
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        authScreen.classList.add("hidden");
        const currentUsername = user.displayName || user.email.split("@")[0];
        usernameDisplay.textContent = currentUsername;
        gameCreatorDisplay.textContent = `@${currentUsername}`;
        
        // Ensure user is registered in searchable directory
        set(ref(db, `users/${user.uid}`), { username: currentUsername });
        
        // Listen for user's friends list
        loadFriendsList();
      } else {
        currentUser = null;
        authScreen.classList.remove("hidden");
      }
    });

    // SEARCH & ADD FRIENDS FEATURE
    searchPersonBtn.addEventListener("click", async () => {
      const query = searchPersonInput.value.trim().toLowerCase();
      if (!query) return;

      const usersSnap = await get(ref(db, "users"));
      searchResultsDropdown.innerHTML = "";
      
      if (usersSnap.exists()) {
        const users = usersSnap.val();
        let matches = 0;

        Object.keys(users).forEach(uid => {
          if (currentUser && uid === currentUser.uid) return;
          const uname = users[uid].username || "";

          if (uname.toLowerCase().includes(query)) {
            matches++;
            const item = document.createElement("div");
            item.className = "search-result-item";
            item.innerHTML = `<span>${uname}</span> <button data-uid="${uid}" data-uname="${uname}">Add</button>`;
            
            item.querySelector("button").addEventListener("click", (e) => {
              const targetUid = e.target.getAttribute("data-uid");
              const targetUname = e.target.getAttribute("data-uname");
              addFriend(targetUid, targetUname);
            });

            searchResultsDropdown.appendChild(item);
          }
        });

        if (matches === 0) {
          searchResultsDropdown.innerHTML = `<div class="search-result-item"><span>No user found</span></div>`;
        }
      } else {
        searchResultsDropdown.innerHTML = `<div class="search-result-item"><span>No users found</span></div>`;
      }

      searchResultsDropdown.classList.remove("hidden");
    });

    function addFriend(friendUid, friendUsername) {
      if (!currentUser) return;
      set(ref(db, `users/${currentUser.uid}/friends/${friendUid}`), {
        username: friendUsername
      });
      searchResultsDropdown.classList.add("hidden");
      searchPersonInput.value = "";
    }

    function loadFriendsList() {
      if (!currentUser) return;
      onValue(ref(db, `users/${currentUser.uid}/friends`), (snapshot) => {
        friendsBox.innerHTML = "";
        const friendsData = snapshot.val() || {};
        
        if (Object.keys(friendsData).length === 0) {
          friendsBox.innerHTML = `<span style="color: #888; font-size: 14px;">No friends added yet</span>`;
          return;
        }

        Object.values(friendsData).forEach(friend => {
          const item = document.createElement("div");
          item.className = "friend-item";
          item.innerHTML = `<div class="friend-icon"></div><span>${friend.username}</span>`;
          friendsBox.appendChild(item);
        });
      });
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".friend-search-container")) {
        searchResultsDropdown.classList.add("hidden");
      }
    });

    // PRESENCE & STATS
    const visitCountEl = document.getElementById("visit-count");
    const playingCountEl = document.getElementById("playing-count");
    const dashboardPeopleCountEl = document.getElementById("dashboard-people-count");

    const visitsRef = ref(db, "games/test/visits");
    const activePlayersRef = ref(db, "games/test/activePlayers");
    const chatRef = ref(db, "games/test/chats");

    let hasVisitedThisSession = false;
    let otherPlayers = {};

    onValue(visitsRef, (snapshot) => {
      visitCountEl.textContent = snapshot.val() || 0;
    });

    onValue(activePlayersRef, (snapshot) => {
      const playersData = snapshot.val() || {};
      otherPlayers = playersData;
      const activeCount = Object.keys(playersData).length;
      playingCountEl.textContent = activeCount;
      dashboardPeopleCountEl.textContent = activeCount;
    });

    function incrementVisits() {
      runTransaction(visitsRef, (currentVisits) => (currentVisits || 0) + 1);
    }

    function enterGamePresence() {
      if (!currentUser) return;
      const playerPresenceRef = ref(db, `games/test/activePlayers/${currentUser.uid}`);
      
      myLastMessage = "";
      myMessageTime = 0;

      set(playerPresenceRef, {
        username: currentUser.displayName || "Player",
        x: player.x,
        y: player.y,
        lastMsg: "",
        msgTimestamp: 0
      });

      onDisconnect(playerPresenceRef).remove();
    }

    function updateMyPositionInDB() {
      if (!currentUser) return;
      const myPosRef = ref(db, `games/test/activePlayers/${currentUser.uid}`);
      set(myPosRef, {
        username: currentUser.displayName || "Player",
        x: Math.round(player.x),
        y: Math.round(player.y),
        lastMsg: myLastMessage,
        msgTimestamp: myMessageTime
      });
    }

    function leaveGamePresence() {
      if (!currentUser) return;
      remove(ref(db, `games/test/activePlayers/${currentUser.uid}`));
    }

    // CHAT FILTERING
    const chatMessagesList = document.getElementById("chat-messages");
    const chatForm = document.getElementById("chat-form");
    const chatInput = document.getElementById("chat-input");

    let myLastMessage = "";
    let myMessageTime = 0;
    const IGNORED_KEYS = ["w", "a", "s", "d", "W", "A", "S", "D"];

    onValue(chatRef, (snapshot) => {
      const data = snapshot.val() || {};
      chatMessagesList.innerHTML = "";
      
      const msgArray = Object.values(data).slice(-15);
      msgArray.forEach(msg => {
        if (IGNORED_KEYS.includes(msg.text.trim())) return;

        const item = document.createElement("div");
        item.className = "chat-message-item";
        item.innerHTML = `<span class="chat-author">${msg.username}:</span> ${msg.text}`;
        chatMessagesList.appendChild(item);
      });
      chatMessagesList.scrollTop = chatMessagesList.scrollHeight;
    });

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      
      if (!text || !currentUser || IGNORED_KEYS.includes(text)) {
        chatInput.value = "";
        chatInput.blur();
        return;
      }

      push(chatRef, {
        username: currentUser.displayName || "Player",
        text: text,
        timestamp: Date.now()
      });

      myLastMessage = text;
      myMessageTime = Date.now();
      updateMyPositionInDB();

      chatInput.value = "";
      chatInput.blur(); 
    });

    // PAGE NAVIGATION
    const dashboardView = document.getElementById("dashboard-view");
    const gamePageView = document.getElementById("game-page-view");
    const openGameBtn = document.getElementById("open-game-btn");
    const backBtn = document.getElementById("back-btn");

    openGameBtn.addEventListener("click", () => {
      dashboardView.classList.add("hidden");
      gamePageView.classList.remove("hidden");
      if (!hasVisitedThisSession) {
        incrementVisits();
        hasVisitedThisSession = true; 
      }
    });

    backBtn.addEventListener("click", () => {
      stopGame();
      gamePageView.classList.add("hidden");
      dashboardView.classList.remove("hidden");
    });

    // ENGINE & RENDERING
    const gameDetailsContainer = document.getElementById("game-details-container");
    const gameCanvasContainer = document.getElementById("game-canvas-container");
    const startPlayBtn = document.getElementById("start-play-btn");
    const exitGameBtn = document.getElementById("exit-game-btn");
    const resumeBtn = document.getElementById("resume-btn");
    const pauseMenu = document.getElementById("pause-menu");

    const canvas = document.getElementById("game-canvas");
    const ctx = canvas.getContext("2d");

    let gameAnimationId = null;
    let isGamePlaying = false;
    let isPaused = false;

    // Fat/Chunky Player Dimensions
    const player = {
      x: 200,
      y: 300,
      width: 60,
      height: 70,
      velocityX: 0,
      velocityY: 0,
      speed: 6,
      jumpStrength: -14,
      gravity: 0.6,
      isGrounded: false
    };

    const keys = { a: false, d: false, w: false, ArrowLeft: false, ArrowRight: false, ArrowUp: false, " ": false };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", () => { if (isGamePlaying) resizeCanvas(); });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && isGamePlaying) {
        if (document.activeElement === chatInput) chatInput.blur();
        togglePauseMenu();
        return;
      }
      if (e.key === "Enter" && isGamePlaying && !isPaused) {
        if (document.activeElement !== chatInput) {
          chatInput.focus();
          return;
        }
      }
      if (document.activeElement === chatInput) return;

      if (keys.hasOwnProperty(e.key) || keys.hasOwnProperty(e.key.toLowerCase())) {
        keys[e.key] = true;
        keys[e.key.toLowerCase()] = true;
      }
    });

    window.addEventListener("keyup", (e) => {
      if (document.activeElement === chatInput) return;
      if (keys.hasOwnProperty(e.key) || keys.hasOwnProperty(e.key.toLowerCase())) {
        keys[e.key] = false;
        keys[e.key.toLowerCase()] = false;
      }
    });

    function togglePauseMenu() {
      isPaused = !isPaused;
      pauseMenu.classList.toggle("hidden", !isPaused);
    }

    resumeBtn.addEventListener("click", () => {
      isPaused = false;
      pauseMenu.classList.add("hidden");
    });

    startPlayBtn.addEventListener("click", () => {
      gameDetailsContainer.classList.add("hidden");
      gameCanvasContainer.classList.remove("hidden");
      resizeCanvas();
      isGamePlaying = true;
      isPaused = false;
      
      myLastMessage = "";
      myMessageTime = 0;
      chatInput.value = "";
      chatInput.blur();

      pauseMenu.classList.add("hidden");
      enterGamePresence();
      resetPlayer();
      gameLoop();
    });

    exitGameBtn.addEventListener("click", () => {
      stopGame();
      gameCanvasContainer.classList.add("hidden");
      gameDetailsContainer.classList.remove("hidden");
    });

    function stopGame() {
      leaveGamePresence();
      isGamePlaying = false;
      isPaused = false;
      myLastMessage = "";
      myMessageTime = 0;
      if (gameAnimationId) {
        cancelAnimationFrame(gameAnimationId);
        gameAnimationId = null;
      }
    }

    function resetPlayer() {
      player.x = 200;
      player.y = canvas.height - 190;
      player.velocityX = 0;
      player.velocityY = 0;
    }

    function gameLoop() {
      if (!isPaused) {
        updateGame();
        drawGame();
      }
      if (isGamePlaying) {
        gameAnimationId = requestAnimationFrame(gameLoop);
      }
    }

    function updateGame() {
      let moved = false;

      if (keys.a || keys.ArrowLeft) {
        player.velocityX = -player.speed;
        moved = true;
      } else if (keys.d || keys.ArrowRight) {
        player.velocityX = player.speed;
        moved = true;
      } else {
        player.velocityX = 0;
      }

      if ((keys.w || keys.ArrowUp || keys[" "]) && player.isGrounded) {
        player.velocityY = player.jumpStrength;
        player.isGrounded = false;
        moved = true;
      }

      player.velocityY += player.gravity;
      player.x += player.velocityX;
      player.y += player.velocityY;

      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

      const groundY = canvas.height - 120;
      if (player.y + player.height >= groundY) {
        player.y = groundY - player.height;
        player.velocityY = 0;
        player.isGrounded = true;
      }

      if (moved || Math.abs(player.velocityY) > 0.1) {
        updateMyPositionInDB();
      }
    }

    function drawGame() {
      ctx.fillStyle = "#70c5ce";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(150, 80, 120, 40);
      ctx.fillRect(canvas.width * 0.5, 120, 160, 55);
      ctx.fillRect(canvas.width * 0.8, 60, 110, 35);

      const groundHeight = 120;
      ctx.fillStyle = "#8b5a2b";
      ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);

      ctx.fillStyle = "#2e8b57";
      ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 20);

      const now = Date.now();
      Object.keys(otherPlayers).forEach(uid => {
        if (currentUser && uid === currentUser.uid) return;
        const p = otherPlayers[uid];
        drawCharacter(p.x, p.y, p.username, "#00ffff");

        if (p.lastMsg && !IGNORED_KEYS.includes(p.lastMsg) && now - p.msgTimestamp < 4000) {
          drawSpeechBubble(p.x + 30, p.y - 10, p.lastMsg);
        }
      });

      drawCharacter(player.x, player.y, currentUser ? (currentUser.displayName || "You") : "You", "#00ffff");

      if (myLastMessage && !IGNORED_KEYS.includes(myLastMessage) && now - myMessageTime < 4000) {
        drawSpeechBubble(player.x + 30, player.y - 10, myLastMessage);
      }
    }

    function drawCharacter(px, py, username, shirtColor) {
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 14px monospace";
      ctx.textAlign = "center";
      ctx.fillText(username, px + 30, py - 10);

      ctx.fillStyle = "#ffcc99";
      ctx.fillRect(px + 12, py, 36, 26);

      ctx.fillStyle = "#000000";
      ctx.fillRect(px + 20, py + 8, 6, 6);
      ctx.fillRect(px + 34, py + 8, 6, 6);

      ctx.fillStyle = shirtColor;
      ctx.fillRect(px + 12, py + 26, 36, 26);

      ctx.fillStyle = "#ffcc99";
      ctx.fillRect(px, py + 26, 12, 26);
      ctx.fillRect(px + 48, py + 26, 12, 26);

      ctx.fillStyle = "#002b80";
      ctx.fillRect(px + 12, py + 52, 36, 18);
    }

    function drawSpeechBubble(centerX, topY, text) {
      ctx.font = "12px monospace";
      const textWidth = ctx.measureText(text).width;
      const padding = 8;
      const bubbleWidth = textWidth + padding * 2;
      const bubbleHeight = 22;

      const bx = centerX - bubbleWidth / 2;
      const by = topY - bubbleHeight - 10;

      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 2;

      ctx.fillRect(bx, by, bubbleWidth, bubbleHeight);
      ctx.strokeRect(bx, by, bubbleWidth, bubbleHeight);

      ctx.beginPath();
      ctx.moveTo(centerX - 4, by + bubbleHeight);
      ctx.lineTo(centerX, by + bubbleHeight + 6);
      ctx.lineTo(centerX + 4, by + bubbleHeight);
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      ctx.fillStyle = "#000000";
      ctx.textAlign = "center";
      ctx.fillText(text, centerX, by + 15);
    }
  </script>
</body>
</html>
